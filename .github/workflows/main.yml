steps:
  - name: Repozitoriyni yuklab olish
    uses: actions/checkout@v4

  - name: Node.js o'rnatish
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Java JDK 17 o'rnatish
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Android SDK sozlash va litsenziyalarni tasdiqlash
    uses: android-actions/setup-android@v3

  - name: Android litsenziyalarini avtomatik qabul qilish
    run: |
      yes | sdkmanager --licenses || true

  - name: Node paketlarini o'rnatish
    run: |
      npm install

  - name: Web fayllarni tekshirish (www papkasi)
    run: |
      mkdir -p www
      # Agar index.html asosiy papkada bo'lsa, www ichiga nusxalash
      if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
        cp index.html www/
      fi
      # Yoki kompyuter_tarmoqlari_app.html bo'lsa index.html ga aylantirish
      if [ -f "kompyuter_tarmoqlari_app.html" ]; then
        cp kompyuter_tarmoqlari_app.html www/index.html
      fi

  - name: Capacitor Android platformasini yaratish va sinxronlash
    run: |
      if [ ! -d "android" ]; then
        npx cap add android
      fi
      npx cap sync android

  - name: Gradle fayliga ruxsat berish
    run: |
      cd android
      chmod +x gradlew

  - name: Android APK ni yig'ish (Assemble Debug)
    run: |
      cd android
      ./gradlew assembleDebug --stacktrace

  - name: Tayyor APK faylini yuklab olish uchun saqlash (Artifacts)
    uses: actions/upload-artifact@v4
    with:
      name: KompyuterTarmoqlari-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
