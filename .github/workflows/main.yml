name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodni repozitoriydan yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 20 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java JDK 21 o'rnatish (Capacitor 6 va Gradle 8 uchun)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK sozlash
        uses: android-actions/setup-android@v3

      - name: Web aktivlarni tekshirish va www papkaga nusxalash
        run: |
          mkdir -p www
          if [ -f "kompyuter_tarmoqlari_app.html" ] && [ ! -f "www/index.html" ]; then
            cp kompyuter_tarmoqlari_app.html www/index.html
          elif [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          ls -la www/

      - name: Capacitor bog'liqliklarini o'rnatish
        run: |
          npm install
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Gradle orqali Debug APK yig'ish (assembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Tayyor APK faylni yuklab olish uchun saqlash (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KompyuterTarmoqlari-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
