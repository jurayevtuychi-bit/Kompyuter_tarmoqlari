name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Yig'ish va APK yaratish
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriy kodini yuklab olish
        uses: actions/checkout@v4

      - name: Node.js muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Web aktivlarni tayyorlash (www papkasi)
        run: |
          mkdir -p www
          if [ -f "atom_fizikasi_app.html" ]; then
            cp atom_fizikasi_app.html www/index.html
          elif [ -f "kompyuter_tarmoqlari_app.html" ]; then
            cp kompyuter_tarmoqlari_app.html www/index.html
          elif [ -f "veb_tizimlari_app.html" ]; then
            cp veb_tizimlari_app.html www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "<h1>Mobil ilova yuklanmoqda...</h1>" > www/index.html
          fi

      - name: NPM paketlarini o'rnatish
        run: |
          if [ -f "package.json" ]; then
            npm install
          else
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
          fi

      - name: Capacitor konfiguratsiyasini ta'minlash
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "AtomFizikasi" "uz.app.atomfizikasi" --web-dir "www"
          fi

      - name: Capacitor Android platformasini yaratish va sinxronlash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gradle fayliga bajarish huquqini berish
        run: |
          chmod +x android/gradlew

      - name: Android Debug APK yig'ish (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Tayyor APK faylini saqlash (Artifacts orqali yuklab olish)
        uses: actions/upload-artifact@v4
        with:
          name: MobilIlova-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
