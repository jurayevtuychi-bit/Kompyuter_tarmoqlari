name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Yig'ish va APK yaratish
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriy kodini yuklab olish
        uses: actions/checkout@v4

      - name: Node.js 20 muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK sozlash
        uses: android-actions/setup-android@v3

      - name: Android SDK litsenziyalarini avtomatik qabul qilish
        run: |
          yes | sdkmanager --licenses || true

      - name: NPM paketlarini o'rnatish
        run: |
          npm install

      - name: Web aktivlarni tayyorlash (www papkasi)
        run: |
          mkdir -p www
          if [ -f "kompyuter_tarmoqlari_app.html" ]; then
            cp kompyuter_tarmoqlari_app.html www/index.html
          elif [ -f "veb_tizimlari_app.html" ]; then
            cp veb_tizimlari_app.html www/index.html
          elif [ -f "atom_fizikasi_app.html" ]; then
            cp atom_fizikasi_app.html www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          fi

      - name: Capacitor Android platformasini yaratish va sinxronlash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gradle fayliga bajarish huquqini berish
        run: |
          cd android
          chmod +x gradlew

      - name: Android Debug APK yig'ish (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Tayyor APK faylini saqlash (Artifacts orqali yuklab olish)
        uses: actions/upload-artifact@v4
        with:
          name: MobilIlova-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
